<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Small 3 的个人领域</title>
  <style>
    :root{
      --accent: #60a5fa;
      --accent-2: #3b82f6;
      --muted: rgba(230,238,248,0.6);
      --glass: rgba(255,255,255,0.02);
      --radius: 12px;
    }

    html, body { height: 100%; }

    /* 背景使用图片 + 渐变��加，替换下面的 URL 即可更换背景图 */
    body{
      margin: 0;
      /* 图片来源示例：Unsplash（可替换为你自己的图片 URL） */
      background:
        linear-gradient(180deg, rgba(7,16,38,0.6) 0%, rgba(7,16,38,0.6) 100%),
        url('https://i.mituw.com/imgs/2026/02/16/ca72241243868693.jpg') center/cover no-repeat fixed;
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .wrap{
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    header{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .logo{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 6px 18px rgba(96,165,250,0.12);
      flex: 0 0 64px;
    }

    h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.6px;
    }

    .subtitle{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .content{
      margin-top: 18px;
    }

    .intro{
      background: var(--glass);
      padding: 12px 14px;
      border-radius: 10px;
      color: #dceafc;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .links{
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .links a{
      text-decoration: none;
      color: inherit;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.02);
      transition: transform .16s ease, box-shadow .16s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(2,6,23,0.6);
    }

    .card .title{
      font-weight: 600;
      color: #f3f9ff;
      font-size: 15px;
    }

    .card .desc{
      font-size: 13px;
      color: var(--muted);
    }

    footer{
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .small{
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width:520px){
      .logo{width:52px;height:52px;font-size:18px;}
      .wrap{padding:18px;}
    }
    @media (max-width: 520px) {
  .wrap {
    padding: 10px;
    min-width: 0;
    max-width: 100vw;
    box-sizing: border-box;
  }
  form[action="https://www.bing.com/search"] {
    flex-direction: column;
    gap: 8px;
  }
  form[action="https://www.bing.com/search"] input[type="text"],
  form[action="https://www.bing.com/search"] button {
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    box-sizing: border-box;
  }
  .links {
    grid-template-columns: 1fr !important;
    gap: 10px;
  }
  header {
    flex-direction: row;
    align-items: flex-start;
    gap: 8px;
  }
}
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <div class="logo">S3</div>
      <div>
        <h1>Small 3 的个人领域</h1>
        <div class="subtitle">收藏与分享我觉得有趣的站点与资源</div>
      </div>
    </header>

    <section class="content">
      <div class="intro">
        我是 Small 3，这是我的个人领域。下面是我收藏的几个站点，欢迎访问。
      </div>

      <h2 style="margin:0 0 10px 0;font-size:14px;color:var(--muted)">—— SMALL 3 领域 ——</h2>
<form action="https://www.bing.com/search" method="get" target="_blank" style="margin-bottom:18px;display:flex;gap:6px;">
  <input type="text" name="q" placeholder="必应搜索…" style="flex:1;padding:7px 12px;border-radius:8px;border:1px solid #3b82f6;outline:none;font-size:15px;">
  <button type="submit" style="padding:7px 16px;border-radius:8px;border:none;background:#60a5fa;color:white;font-weight:600;cursor:pointer;">必应搜索</button>
</form>
      <style>
    .search-container {
        margin-bottom: 18px;
        position: relative;
    }
    
    .search-form {
        display: flex;
        gap: 6px;
        margin-bottom: 15px;
    }
    
    .search-input {
        flex: 1;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid #3b82f6;
        outline: none;
        font-size: 15px;
    }
    
    .search-button {
        padding: 7px 16px;
        border-radius: 8px;
        border: none;
        background: #10B981;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
    }
    
    .search-button:hover {
        background: #059669;
        transform: translateY(-1px);
    }
    
    .search-button:active {
        transform: translateY(0);
    }
    
    .search-results {
        width: 100%;
        height: 0;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 0;
        opacity: 0;
        transition: all 0.3s ease;
        position: absolute;
        z-index: 1000;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        background: white;
    }
    
    .search-results.active {
        height: 600px;
        margin-top: 10px;
        border: 1px solid #ddd;
        opacity: 1;
        position: relative;
    }
    
    .results-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: none;
    }
    
    .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #666;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
    }
    
    .error-message {
        display: none;
        background-color: #fee;
        border: 1px solid #fcc;
        border-radius: 8px;
        padding: 15px;
        margin: 20px;
        color: #c00;
    }
    
    .no-results-message {
        text-align: center;
        padding: 40px 20px;
        color: #666;
    }
    
    .results-header {
        display: none;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        background: #f8fafc;
        border-bottom: 1px solid #e5e7eb;
    }
    
    .results-title {
        font-weight: 600;
        color: #374151;
    }
    
    .close-results {
        background: none;
        border: none;
        font-size: 24px;
        color: #6b7280;
        cursor: pointer;
        line-height: 1;
        padding: 0 5px;
        transition: color 0.2s ease;
    }
    
    .close-results:hover {
        color: #ef4444;
    }
</style>

<div class="search-container">
    <form id="songSearchForm" class="search-form">
        <input type="text" id="searchKeyword" class="search-input" placeholder="搜索歌曲、歌手或专辑...">
        <button type="submit" class="search-button">搜索歌曲</button>
    </form>
    
    <div id="searchResults" class="search-results">
        <div class="results-header">
            <div class="results-title">搜索结果</div>
            <button class="close-results" onclick="closeResults()">×</button>
        </div>
        
        <div id="loading" class="loading">
            <div>正在加载搜索结果...</div>
            <div style="margin-top: 10px; font-size: 14px; color: #9ca3af;">这可能需要几秒钟时间</div>
        </div>
        
        <div id="errorMessage" class="error-message">
            抱歉，无法加载搜索结果。请检查网络连接或稍后重试。
        </div>
        
        <div id="initialMessage" class="no-results-message">
            <h3>歌曲搜索</h3>
            <p>请输入关键词搜索歌曲、歌手或专辑</p>
            <p>示例：周杰伦、青花瓷、Taylor Swift</p>
        </div>
        
        <iframe id="resultsFrame" class="results-iframe"></iframe>
    </div>
</div>

<script>
    // 搜索表单提交事件
    document.getElementById('songSearchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var keyword = document.getElementById('searchKeyword').value.trim();
        
        if (!keyword) {
            alert('请输入要搜索的歌曲名称或歌手名称');
            return;
        }
        
        // 获取结果容器和iframe
        var resultsContainer = document.getElementById('searchResults');
        var iframe = document.getElementById('resultsFrame');
        
        // 显示结果容器并激活状态
        resultsContainer.classList.add('active');
        document.querySelector('.results-header').style.display = 'flex';
        
        // 显示加载状态
        document.getElementById('loading').style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('initialMessage').style.display = 'none';
        iframe.style.display = 'none';
        
        // 构建歌曲海搜索URL
        var searchUrl = 'https://www.gequhai.com/s/' + encodeURIComponent(keyword);
        
        // 设置iframe的src
        iframe.src = searchUrl;
        
        // 监听iframe加载完成
        iframe.onload = function() {
            document.getElementById('loading').style.display = 'none';
            iframe.style.display = 'block';
            
            // 设置结果标题
            document.querySelector('.results-title').textContent = `搜索结果: ${keyword}`;
        };
        
        // 监听iframe加载错误
        iframe.onerror = function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.querySelector('.results-title').textContent = `搜索失败: ${keyword}`;
        };
    });
    
    // 关闭结果区域的函数
    function closeResults() {
        var resultsContainer = document.getElementById('searchResults');
        var iframe = document.getElementById('resultsFrame');
        
        // 移除激活状态
        resultsContainer.classList.remove('active');
        
        // 隐藏头部
        document.querySelector('.results-header').style.display = 'none';
        
        // 重置状态
        document.getElementById('loading').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('initialMessage').style.display = 'block';
        iframe.style.display = 'none';
        
        // 可选：清除iframe的src以避免继续加载
        // iframe.src = '';
        
        // 可选：回到页面顶部
        // window.scrollTo(0, 0);
    }
    
    // 点击页面其他地方关闭搜索结果（可选）
    document.addEventListener('click', function(e) {
        var resultsContainer = document.getElementById('searchResults');
        var searchForm = document.getElementById('songSearchForm');
        
        // 如果点击的不是搜索结果区域，也不是搜索表单
        if (!resultsContainer.contains(e.target) && 
            !searchForm.contains(e.target) && 
            resultsContainer.classList.contains('active')) {
            closeResults();
        }
    });
    
    // 添加回车键搜索支持
    document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('songSearchForm').dispatchEvent(new Event('submit'));
        }
    });
    
    // 页面加载完成后，给搜索框自动焦点
    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('searchKeyword').focus();
    });
    
    // ESC键关闭搜索结果
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var resultsContainer = document.getElementById('searchResults');
            if (resultsContainer.classList.contains('active')) {
                closeResults();
            }
        }
    });
</script>

    </section>

    <footer>
